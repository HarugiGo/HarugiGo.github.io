<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Xia</title>
    <meta name="description" content="Summer Xia · 大明湖畔夏雨荷">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Noto+Serif+SC:wght@400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <header class="site-header">
        <nav class="nav">
            <a href="https://github.com/HarugiGo" target="_blank" rel="noopener" class="nav-github">GitHub</a>
        </nav>
    </header>

    <main id="top">
        <section class="hero">
            <h1 class="hero-title">Harugi</h1>
            <div class="hero-tags">
                <span>AI 共学</span>
                <span class="dot">·</span>
                <span>街头摄影</span>
                <span class="dot">·</span>
                <span>国际政策分析</span>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Work</h2>
            <div class="cards">
                <a class="card" href="https://kvs656xf1s.feishu.cn/docx/LcVYdN66voGmfMxl2tVcEqAJn0g" target="_blank" rel="noopener">
                    <h3 class="card-title">AI 小程序 · 酒窖小管家</h3>
                    <p class="card-meta">飞书文档 · 2025.03</p>
                </a>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Writing</h2>
            <div class="cards">
                <a class="card" href="https://saisobserver.org/2024/11/13/the-shifting-landscape-of-iphone-manufacturing-from-china-to-india/" target="_blank" rel="noopener">
                    <h3 class="card-title">The Shifting Landscape of iPhone Manufacturing from China to India</h3>
                    <p class="card-meta">SAIS Observer · 2024.11</p>
                </a>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Photography</h2>
            <div class="slider" id="slider">
                <div class="slider-track">
                    <figure class="slide">
                        <img src="images/photo-geneva.jpg" alt="瑞士 · 日内瓦" loading="eager">
                        <figcaption>瑞士 · 日内瓦</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="images/photo-osaka.jpg" alt="日本 · 大阪" loading="lazy">
                        <figcaption>日本 · 大阪</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="images/photo-dc.jpg" alt="美国 · 华盛顿" loading="lazy">
                        <figcaption>美国 · 华盛顿</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="images/photo-rio.jpg" alt="巴西 · 里约热内卢" loading="lazy">
                        <figcaption>巴西 · 里约热内卢</figcaption>
                    </figure>
                </div>
                <button class="slider-btn prev" aria-label="Previous">‹</button>
                <button class="slider-btn next" aria-label="Next">›</button>
                <div class="slider-dots" aria-hidden="true"></div>
            </div>
        </section>

        <footer class="site-footer">
            <a href="https://github.com/HarugiGo" target="_blank" rel="noopener">github.com/HarugiGo</a>
        </footer>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
